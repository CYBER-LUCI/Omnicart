<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCart — Product Catalog</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Clean Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans text-base">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none max-w-sm w-full"></div>

  <!-- MAIN NAVIGATION HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
          🛒
        </div>
        <div>
          <span class="text-2xl font-bold tracking-tight text-slate-900 block leading-tight">OmniCart</span>
          <span class="text-xs text-slate-500 font-medium block">All Products Catalog</span>
        </div>
      </a>

      <!-- Right Header Actions (Initial Login Option vs Logged In) -->
      <div class="flex items-center gap-3 shrink-0">
        
        <!-- Saved Products Link (Guarded) -->
        <a
          href="saved-products.html"
          onclick="return AuthModule.guardUserClick('saved-products.html', event)"
          class="flex items-center gap-1.5 p-2 rounded-lg text-slate-700 hover:bg-slate-100 text-xs font-semibold"
        >
          <span>❤️</span>
          <span class="hidden sm:inline">Saved</span>
          <span id="header-saved-badge" class="badge badge-blue text-[11px] saved-count-badge">0</span>
        </a>

        <!-- Cart Button (Guarded) -->
        <a
          href="cart.html"
          onclick="return AuthModule.guardUserClick('cart.html', event)"
          class="btn-secondary py-2 px-3 text-xs font-semibold flex items-center gap-2"
        >
          <span>🛒</span>
          <span class="hidden sm:inline">Cart</span>
          <span id="header-cart-badge" class="badge badge-blue text-[11px]">0</span>
        </a>

        <!-- INITIAL LOGIN BUTTON (When Guest) -->
        <div id="header-guest-auth" class="flex items-center gap-2">
          <a
            href="login.html"
            class="btn-primary py-2 px-4 text-xs font-semibold"
          >
            Sign In
          </a>
        </div>

        <!-- LOGGED IN USER (When Authenticated) -->
        <div id="header-user-auth" class="relative hidden">
          <button
            onclick="AuthModule.toggleAuthDropdown()"
            class="flex items-center gap-2 px-3.5 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold text-slate-800 transition-colors"
          >
            <div class="w-2.5 h-2.5 rounded-full bg-blue-600"></div>
            <span id="header-user-name">My Account</span>
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>

          <!-- Dropdown -->
          <div
            id="auth-dropdown-menu"
            class="hidden absolute right-0 mt-2 w-64 rounded-xl bg-white border border-slate-200 shadow-xl p-2 z-50 text-sm"
          >
            <div id="auth-dropdown-items"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Secondary Nav Bar with Larger Fonts -->
    <div class="border-t border-slate-100 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between text-sm py-2 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-1.5">
          <a href="index.html" class="nav-tab">Home</a>
          <a href="products.html" class="nav-tab active">All Products</a>
          <a href="saved-products.html" onclick="return AuthModule.guardUserClick('saved-products.html', event)" class="nav-tab">Saved Products (Wishlist)</a>
          <a href="cart.html" onclick="return AuthModule.guardUserClick('cart.html', event)" class="nav-tab">My Cart</a>
          <a href="orders.html" onclick="return AuthModule.guardUserClick('orders.html', event)" class="nav-tab">Track Orders</a>
          <a href="customer-profile.html" onclick="return AuthModule.guardUserClick('customer-profile.html', event)" class="nav-tab">My Profile</a>
        </div>
        <a href="seller-dashboard.html" onclick="return AuthModule.guardSellerClick('seller-dashboard.html', event)" class="text-xs font-semibold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3.5 py-1.5 rounded-lg transition-colors shrink-0">
          Seller Portal ↗
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CATALOG WORKSPACE (2 Columns) -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- LEFT SIDEBAR: FILTERS -->
      <aside class="lg:col-span-3 clean-card p-6 space-y-6">
        <div>
          <h3 class="font-bold text-slate-900 text-base mb-3">Categories</h3>
          <div class="space-y-1.5" id="catalog-category-filter">
            <!-- Populated via CatalogModule -->
          </div>
        </div>

        <div class="pt-5 border-t border-slate-100">
          <label class="block font-bold text-sm text-slate-900 mb-2">Filter by Verified Seller</label>
          <select
            id="catalog-seller-filter"
            onchange="CatalogModule.handleSellerChange(this.value)"
            class="clean-input text-sm py-2"
          >
            <!-- Populated via CatalogModule -->
          </select>
        </div>

        <div class="pt-5 border-t border-slate-100">
          <label class="flex items-center gap-2.5 text-sm font-medium text-slate-700 cursor-pointer">
            <input
              type="checkbox"
              id="catalog-stock-check"
              onchange="CatalogModule.toggleStockOnly(this.checked)"
              class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4"
            />
            <span>In-Stock Items Only</span>
          </label>
        </div>
      </aside>

      <!-- RIGHT SIDE: SEARCH & PRODUCTS GRID -->
      <div class="lg:col-span-9 space-y-6">

        <!-- Top filter bar -->
        <div class="clean-card p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
          
          <div class="relative w-full sm:max-w-md flex items-center">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input
              type="text"
              id="catalog-search-input"
              placeholder="Search products by name..."
              oninput="CatalogModule.handleSearchInput(this.value)"
              class="clean-input pl-10 pr-28 py-2 text-sm"
            />
            <button
              onclick="VisualSearchModule.openModal('camera')"
              class="absolute right-1.5 px-2.5 py-1 text-xs rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition-colors flex items-center gap-1"
              title="Search by camera or gallery"
            >
              <span>📷</span> Visual
            </button>
          </div>

          <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
            <span id="catalog-results-count" class="text-sm text-slate-500 font-medium">Loading products...</span>
            <select
              id="catalog-sort-select"
              onchange="CatalogModule.handleSortChange(this.value)"
              class="clean-input text-sm py-2 w-auto"
            >
              <option value="featured">Featured</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </div>

        </div>

        <!-- Products Grid -->
        <div id="catalog-products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Dynamically populated via CatalogModule -->
        </div>

      </div>

    </div>

  </main>

  <!-- CLEAN FOOTER -->
  <footer class="bg-white border-t border-slate-200 mt-16 py-10 text-sm text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="font-bold text-slate-900 text-base">OmniCart Marketplace</span>
        <span>•</span>
        <span>DBMS Project (Group 21)</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="cart.html" class="hover:underline">Cart</a>
        <a href="orders.html" class="hover:underline">My Orders</a>
        <a href="seller-dashboard.html" class="hover:underline text-emerald-700 font-semibold">Seller Portal</a>
      </div>
    </div>
  </footer>

  <!-- CLEAN LOGIN MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs hidden">
    <div class="relative w-full max-w-md bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-2xl">
      <button onclick="AuthModule.closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>

      <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 mb-5 text-xs">
        <button id="modal-tab-buyer" onclick="AuthModule.setModalTab('buyer')" class="py-2.5 rounded-lg font-semibold transition-all bg-white text-blue-700 shadow-xs border border-slate-200">Customer Access</button>
        <button id="modal-tab-seller" onclick="AuthModule.setModalTab('seller')" class="py-2.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900">Seller Portal</button>
      </div>

      <div id="auth-modal-form-container"></div>
    </div>
  </div>

  <!-- JAVASCRIPT MODULES -->
  <script src="js/data-store.js"></script>
  <script src="js/ui-module.js"></script>
  <script src="js/auth-module.js"></script>
  <script src="js/visual-search-module.js"></script>
  <script src="js/catalog-module.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      CatalogModule.init();
    });
  </script>
</body>
</html>
